<!DOCTYPE html>
<html>
<head>
    <title>Salary Management</title>
</head>
<body>

    <h1>Salary Management</h1>

    <a href="{% url 'add_salary' %}">Add Salary</a>

    <br><br>

    <table border="1" cellpadding="10">
        <tr>
            <th>Employee</th>
            <th>Amount</th>
            <th>Payment Date</th>
            <th>Month</th>
        </tr>

        {% for salary in salaries %}
        <tr>
            <td>{{ salary.employee }}</td>
            <td>{{ salary.amount }}</td>
            <td>{{ salary.payment_date }}</td>
            <td>{{ salary.month }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No salary records found.</td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
