<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Departments</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .department {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>Departments</h1>

    {% for department in departments %}
        <div class="department">
            {{ department.name }}
        </div>
    {% empty %}
        <p>No departments found.</p>
    {% endfor %}

</body>
</html>
