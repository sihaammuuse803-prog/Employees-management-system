<!DOCTYPE html>
<html>
<head>
    <title>Add Position</title>
</head>
<body>

    <h1>Add New Position</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Position Name:</label>
        <input type="text" name="name" required>

        <button type="submit">Save Position</button>
    </form>

    <br>

    <a href="{% url 'position_list' %}">Back to Positions</a>

</body>
</html>
