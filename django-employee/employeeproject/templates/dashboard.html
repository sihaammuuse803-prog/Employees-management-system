<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .sidebar {
            width: 230px;
            height: 100vh;
            background: #1f2937;
            position: fixed;
            left: 0;
            top: 0;
            padding: 20px;
        }

        .sidebar h2 {
            color: white;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 5px;
        }

        .sidebar a:hover {
            background: #374151;
        }

        .main {
            margin-left: 230px;
            padding: 30px;
        }

        .main h1 {
            margin-bottom: 25px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card h3 {
            color: #555;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 30px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="sidebar">
    <h2>EMS</h2>

    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'employee_list' %}">Employees</a>
    <a href="{% url 'department_list' %}">Departments</a>
    <a href="#">Positions</a>
    <a href="#">Attendance</a>
    <a href="#">Salary</a>
    <a href="#">Logout</a>
</div>
    <div class="main">

        <h1>Employee Management System</h1>

        <div class="cards">

            <div class="card">
                <h3>Total Employees</h3>
                <p>{{ total_employees }}</p>
            </div>

            <div class="card">
                <h3>Departments</h3>
                <p>{{ departments_count }}</p>
            </div>

            <div class="card">
                <h3>Attendance</h3>
                <p>{{ attendance_count }}</p>
            </div>

            <div class="card">
                <h3>Active Employees</h3>
                <p>{{ active_employees }}</p>
            </div>

        </div>

    </div>

</body>
</html>
